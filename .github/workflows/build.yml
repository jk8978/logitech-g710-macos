name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build G710Keys.app
        run: ./scripts/build.sh
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: G710Keys.app
          path: build/G710Keys.app
